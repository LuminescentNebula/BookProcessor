<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}BookProcessor{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  {% block head %}{% endblock %}
</head>
<body data-role="{{ session.role or '' }}">
<nav>
  {% if session.role == 'admin' %}<a href="/">Обработка</a>{% endif %}
  <a href="/library">Библиотека</a><a href="/books">Таблица</a>
  {% if session.role == 'admin' %}<a href="/settings">Настройки</a><a href="/users">Пользователи</a>{% endif %}
  <form method="post" action="/logout" class="logout"><button class="button secondary">Выйти ({{ session.username }})</button></form>
</nav>
<main>{% block content %}{% endblock %}</main>
{% block scripts %}{% endblock %}
</body></html>
