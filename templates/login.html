<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вход — BookProcessor</title><link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}"></head><body class="login-page"><form class="login" method="post"><h1>BookProcessor</h1><p>Войдите для продолжения.</p>{% if error %}<p class="error">{{ error }}</p>{% endif %}<label>Имя пользователя<input name="username" autocomplete="username" required autofocus></label><label>Пароль<input name="password" type="password" autocomplete="current-password" required></label><button class="button">Войти</button></form></body></html>
