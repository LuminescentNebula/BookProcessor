<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вход — BookProcessor</title><style>:root{font-family:system-ui,sans-serif;background:#f3f5f9;color:#172033}body{min-height:100vh;display:grid;place-items:center;margin:0}.login{width:min(380px,calc(100% - 40px));background:white;padding:28px;border-radius:14px;box-shadow:0 8px 30px #1f2a4418}.login label{display:block;font-weight:650;margin:15px 0}.login input{box-sizing:border-box;width:100%;padding:11px;margin-top:6px;border:1px solid #ccd3df;border-radius:7px}.login button{width:100%;padding:11px;border:0;border-radius:7px;background:#315bea;color:white;font-weight:700}.error{padding:10px;background:#ffe9e9;color:#8b1a1a;border-radius:7px}</style></head><body><form class="login" method="post"><h1>BookProcessor</h1><p>Войдите для продолжения.</p>{% if error %}<p class="error">{{ error }}</p>{% endif %}<label>Имя пользователя<input name="username" autocomplete="username" required autofocus></label><label>Пароль<input name="password" type="password" autocomplete="current-password" required></label><button>Войти</button></form></body></html>
