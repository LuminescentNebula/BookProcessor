services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bookprocessor
      POSTGRES_USER: bookprocessor
      POSTGRES_PASSWORD: bookprocessor
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookprocessor -d bookprocessor"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://bookprocessor:bookprocessor@postgres:5432/bookprocessor
      MAX_IMAGE_SIZE: ${MAX_IMAGE_SIZE:-2048}
      OLLAMA_RETRIES: ${OLLAMA_RETRIES:-3}
      PHOTOS_ROOT: /photos
      SECRET_KEY: ${SECRET_KEY:-replace-with-a-long-random-secret}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-now}
      OPEN_LIBRARY_TIMEOUT: ${OPEN_LIBRARY_TIMEOUT:-10}
      OPEN_LIBRARY_RETRIES: ${OPEN_LIBRARY_RETRIES:-2}
      OPEN_LIBRARY_MIN_INTERVAL: ${OPEN_LIBRARY_MIN_INTERVAL:-0.5}
      GOOGLE_BOOKS_TIMEOUT: ${GOOGLE_BOOKS_TIMEOUT:-10}
      GOOGLE_BOOKS_RETRIES: ${GOOGLE_BOOKS_RETRIES:-2}
      GOOGLE_BOOKS_MIN_INTERVAL: ${GOOGLE_BOOKS_MIN_INTERVAL:-0.5}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      CROSSREF_TIMEOUT: ${CROSSREF_TIMEOUT:-10}
      CROSSREF_RETRIES: ${CROSSREF_RETRIES:-2}
      CROSSREF_MIN_INTERVAL: ${CROSSREF_MIN_INTERVAL:-0.5}
      CROSSREF_MAILTO: ${CROSSREF_MAILTO:-}
      LOC_TIMEOUT: ${LOC_TIMEOUT:-10}
      LOC_RETRIES: ${LOC_RETRIES:-2}
      LOC_MIN_INTERVAL: ${LOC_MIN_INTERVAL:-0.5}
    volumes:
      - ${PHOTOS_PATH:-./photos}:/photos:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build: .
    command: ["python", "worker.py"]
    environment:
      DATABASE_URL: postgresql://bookprocessor:bookprocessor@postgres:5432/bookprocessor
      MAX_IMAGE_SIZE: ${MAX_IMAGE_SIZE:-2048}
      OLLAMA_RETRIES: ${OLLAMA_RETRIES:-3}
      PHOTOS_ROOT: /photos
      OPEN_LIBRARY_TIMEOUT: ${OPEN_LIBRARY_TIMEOUT:-10}
      OPEN_LIBRARY_RETRIES: ${OPEN_LIBRARY_RETRIES:-2}
      OPEN_LIBRARY_MIN_INTERVAL: ${OPEN_LIBRARY_MIN_INTERVAL:-0.5}
      GOOGLE_BOOKS_TIMEOUT: ${GOOGLE_BOOKS_TIMEOUT:-10}
      GOOGLE_BOOKS_RETRIES: ${GOOGLE_BOOKS_RETRIES:-2}
      GOOGLE_BOOKS_MIN_INTERVAL: ${GOOGLE_BOOKS_MIN_INTERVAL:-0.5}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      CROSSREF_TIMEOUT: ${CROSSREF_TIMEOUT:-10}
      CROSSREF_RETRIES: ${CROSSREF_RETRIES:-2}
      CROSSREF_MIN_INTERVAL: ${CROSSREF_MIN_INTERVAL:-0.5}
      CROSSREF_MAILTO: ${CROSSREF_MAILTO:-}
      LOC_TIMEOUT: ${LOC_TIMEOUT:-10}
      LOC_RETRIES: ${LOC_RETRIES:-2}
      LOC_MIN_INTERVAL: ${LOC_MIN_INTERVAL:-0.5}
    volumes:
      - ${PHOTOS_PATH:-./photos}:/photos:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 35m
    healthcheck:
      test: ["CMD", "python", "worker.py", "--health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
