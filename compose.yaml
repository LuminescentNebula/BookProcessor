services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bookprocessor
      POSTGRES_USER: bookprocessor
      POSTGRES_PASSWORD: bookprocessor
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookprocessor -d bookprocessor"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://bookprocessor:bookprocessor@postgres:5432/bookprocessor
      OLLAMA_HOST: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${PHOTOS_PATH:-./photos}:/photos:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
