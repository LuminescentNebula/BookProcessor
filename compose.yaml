services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bookprocessor
      POSTGRES_USER: bookprocessor
      POSTGRES_PASSWORD: bookprocessor
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookprocessor -d bookprocessor"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://bookprocessor:bookprocessor@postgres:5432/bookprocessor
      OLLAMA_HOST: ${OLLAMA_API_URL:-127.0.0.1:11434}
      MAX_IMAGE_SIZE: ${MAX_IMAGE_SIZE:-2048}
      OLLAMA_RETRIES: ${OLLAMA_RETRIES:-3}
      PHOTOS_ROOT: /photos
      OLLAMA_MODELS: ${OLLAMA_MODELS:-qwen2.5vl:7b}
      BOOK_WORKERS: ${BOOK_WORKERS:-1}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-1800}
      FOLDER_SCAN_INTERVAL: ${FOLDER_SCAN_INTERVAL:-5}
      FOLDER_STABLE_SECONDS: ${FOLDER_STABLE_SECONDS:-10}
    volumes:
      - ${PHOTOS_PATH:-./photos}:/photos:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
